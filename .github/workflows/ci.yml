name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Build with strict mode
        run: mkdocs build --strict
      # Reused by the link job and (on main) by deploy, so the site is built once.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

  registry:
    name: Registry drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out earth2studio source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/earth2studio
          path: .earth2studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails if docs/data/registry.json differs from a fresh parse of upstream —
      # i.e. the catalog can never silently drift from the code it documents.
      - name: Check registry is current
        run: python scripts/build_registry.py --source .earth2studio --check

  links:
    name: Check links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Accepted non-2xx codes are anti-bot responses, not broken links:
          #   401 gated Hugging Face repos, 403 doi.org's crawler policy,
          #   202 build.nvidia.com's bot check, 429 host rate limiting.
          # The site's own canonical URLs are excluded: they 404 until the first
          # Pages deploy publishes them, which would fail every PR until then.
          args: >-
            --no-progress
            --accept 200,206,202,401,403,429
            --max-concurrency 8
            --exclude-path site/404.html
            --exclude '^https://negin513\.github\.io/earth2studio-landing'
            'site/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
