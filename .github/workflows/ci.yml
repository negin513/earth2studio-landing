name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registry:
    name: Registry drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out earth2studio source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/earth2studio
          path: .earth2studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if docs/data/registry.json is stale
        run: python scripts/build_registry.py --source .earth2studio --check

  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build with strict mode
        run: mkdocs build --strict

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build
      - name: lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-path site/404.html
            'site/**/*.html'
          fail: true
