name: Deploy

# Publishes to GitHub Pages at https://<owner>.github.io/earth2studio-landing/
#
# Pages is enabled automatically by the configure-pages step below.
# Note this deliberately does NOT publish to nvidia.github.io/earth2studio/, which
# is the official Sphinx docs' address — see site_url in mkdocs.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turn Pages on automatically instead of failing when it has never
          # been configured in repo settings.
          enablement: true

      # Build against the Pages URL so canonical links and the sitemap are correct,
      # rather than the placeholder site_url committed in mkdocs.yml.
      - name: Build site
        run: mkdocs build --strict
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
